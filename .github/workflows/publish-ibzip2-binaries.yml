name: Build and Publish Static ibzip2 Binaries

on:
  push:
    branches: [ "master" ]
    tags: [ 'indexed-bzip2-v*' ]
  workflow_dispatch:

jobs:
  Static-Binary-Build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: 'linux-x86_64.tar.gz'
          - os: ubuntu-26.04-arm
            artifact_suffix: 'linux-aarch64.tar.gz'
          - os: macos-latest
            artifact_suffix: 'darwin-aarch64.tar.gz'
          - os: windows-latest
            artifact_suffix: 'windows-x86_64.zip'
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive

    - name: Install System Dependencies
      if: startsWith( matrix.os, 'ubuntu' )
      run: |
        sudo apt update
        sudo apt-get -y install clang-22 g++ ninja-build

    - name: Install System Dependencies
      if: startsWith( matrix.os, 'macos' )
      run: |
        brew install -q ninja

    - name: Install System Dependencies
      if: startsWith( matrix.os, 'windows' )
      run: |
        choco install ninja

    - name: Configure CMake
      shell: bash
      run: |
        EXTRA_ARGS=()
        EXTRA_ARGS+=( -DLIBRAPIDARCHIVE_BUILD_BENCHMARKS=OFF )
        EXTRA_ARGS+=( -DLIBRAPIDARCHIVE_BUILD_TESTS=OFF )
        EXTRA_ARGS+=( -DLIBRAPIDARCHIVE_BUILD_TOOLS=ON )
        EXTRA_ARGS+=( -DLIBRAPIDARCHIVE_WITH_BZIP2_COMPRESSION=ON )
        # ibzip2 does not use zlib or ISA-L, so do not drag them into the static tool build.
        EXTRA_ARGS+=( -DLIBRAPIDARCHIVE_WITH_ISAL=OFF )
        EXTRA_ARGS+=( -DCMAKE_POSITION_INDEPENDENT_CODE=ON )
        if command -v clang-22 &>/dev/null; then
            # Prefer the newest compiler for code generation, as in the rapidgzip release build.
            CC=clang-22
            CXX=clang++-22
            export CC CXX
            EXTRA_ARGS+=( -DCMAKE_CXX_FLAGS='-std=c++2c' )
        fi
        if [[ "${{ matrix.os }}" =~ windows ]]; then
            EXTRA_ARGS+=( -DCMAKE_EXE_LINKER_FLAGS='-static' )
        elif [[ "${{ matrix.os }}" =~ ubuntu ]]; then
            EXTRA_ARGS+=( -DCMAKE_EXE_LINKER_FLAGS='-static-libgcc -static-libstdc++' )
        fi
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "${EXTRA_ARGS[@]}"

    - name: Build
      run: |
        cmake --build build --target ibzip2 -v

    - name: Smoke Test Binary
      shell: bash
      run: |
        IBZIP2=$( find build/src/tools -maxdepth 1 -type f -name 'ibzip2*' ! -name '*.pdb' | head -1 )
        "$IBZIP2" --version
        "$IBZIP2" -d -c src/tests/data/base64-256KiB.bz2 > "$RUNNER_TEMP/decoded"
        diff -q "$RUNNER_TEMP/decoded" src/tests/data/base64-256KiB
        "$IBZIP2" -z -f -o "$RUNNER_TEMP/compressed.bz2" src/tests/data/base64-256KiB
        "$IBZIP2" -d -c "$RUNNER_TEMP/compressed.bz2" > "$RUNNER_TEMP/roundtrip"
        diff -q "$RUNNER_TEMP/roundtrip" src/tests/data/base64-256KiB

    - name: Package Binary
      shell: bash
      env:
        ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
      run: |
        IBZIP2=$( find build/src/tools -maxdepth 1 -type f -name 'ibzip2*' ! -name '*.pdb' )
        VERSION=$( "$IBZIP2" --version | sed -nE 's|.*version ([0-9.]*).*|\1|p' )
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#indexed-bzip2-v}"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
                echo "ibzip2 reports version $VERSION but the tag is $TAG_VERSION" >&2
                exit 1
            fi
        fi
        ARTIFACT_SUFFIX=$VERSION-$ARTIFACT_SUFFIX
        mv "$IBZIP2" .
        if [[ "$ARTIFACT_SUFFIX" == *.zip ]]; then
            # Git Bash on windows-latest does not ship the zip command. Both 7z and Python are
            # part of the Windows runner image.
            if command -v 7z >/dev/null 2>&1; then
                7z a -tzip "ibzip2-$ARTIFACT_SUFFIX" ibzip2*
            else
                python -m zipfile -c "ibzip2-$ARTIFACT_SUFFIX" ibzip2*
            fi
        else
            tar -czf "ibzip2-$ARTIFACT_SUFFIX" ibzip2
        fi

    - uses: actions/upload-artifact@v7
      with:
        name: ibzip2-${{ matrix.artifact_suffix }}
        path: "ibzip2-*${{ matrix.artifact_suffix }}"

  Static-Binary-Release:
    runs-on: ubuntu-slim
    needs: [Static-Binary-Build]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/download-artifact@v8
      with:
        merge-multiple: true
        pattern: ibzip2*

    # GitHub creates a dummy tag with the commit message as contents, so delete it and fetch the real tag.
    - name: Fetch tags
      if: startsWith(github.ref, 'refs/tags/indexed-bzip2-v')
      run: |
        git tag -n99 -l
        git tag -d ${{ github.ref_name }} || true
        git fetch origin ${{ github.ref }}:${{ github.ref }}

    - name: Prepare Message
      if: startsWith(github.ref, 'refs/tags/indexed-bzip2-v')
      shell: bash
      run: |
        git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release.md
        sed "s|__TAG__|${GITHUB_REF_NAME}|g" .github/workflows/release-template.md >> release.md

    - name: Strip tag prefix from release title
      if: startsWith(github.ref, 'refs/tags/indexed-bzip2-v')
      id: release-title
      run: echo "version=${GITHUB_REF_NAME#indexed-bzip2-v}" >> "$GITHUB_OUTPUT"

    - uses: ncipollo/release-action@v1
      if: startsWith(github.ref, 'refs/tags/indexed-bzip2-v')
      with:
        artifacts: "ibzip2*"
        tag: ${{ github.ref_name }}
        name: "indexed_bzip2 ${{ steps.release-title.outputs.version }}"
        bodyFile: release.md
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        updateOnlyUnreleased: true
        prerelease: true
        draft: true
        makeLatest: false

    - uses: ncipollo/release-action@v1
      if: github.ref_name == 'master'
      with:
        artifacts: "ibzip2*"
        tag: "nightly"
        commit: "master"
        name: "Nightly Release"
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        updateOnlyUnreleased: true
        prerelease: true
        makeLatest: false
        body: |
          This is the newest as of yet unreleased but tested state.
          Try this if you want cutting-edge features or need a fix that has not made it into another release yet.
