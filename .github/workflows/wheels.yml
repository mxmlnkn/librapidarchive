name: Build Wheels

on:
  push:
    branches: 'master'
    tags: 'v*.*.*'
  workflow_dispatch:

jobs:
  Build-Wheels:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-26
        - macos-26-intel
        - ubuntu-24.04-arm
        - ubuntu-24.04
        - windows-latest
        archs: [auto64]
        manylinux-image: [manylinux_2_28]
        # One runner per architecture is enough because MACOSX_DEPLOYMENT_TARGET pins the wheel tag. Building
        # on a newer macOS runner therefore does not raise the minimum supported macOS version, and using two
        # runners per architecture would only produce competing wheels with identical file names.
        #
        # manylinux1 is not supported anymore because it won't compile C++17 code
        # manylinux_2_24, which is newer than manylinux2014, is not supported because it comes with GCC 5.3,
        # which cannot compile C++17 code. Just why?
        # https://github.com/pypa/manylinux/issues/1012
        # manylinux_2_28 has GCC 11 :3 but it has dropped support for i686 (x86 32-bit).
        # manylinux2010 runs into this problem https://github.com/pypa/cibuildwheel/issues/1001
        # MacOS and Windows ignore the manylinux-image version because they are not Linux.
        include:
        - os: ubuntu-24.04
          manylinux-image: manylinux_2_28
          archs: auto32

    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
    - name: System Information
      if: "! startsWith(matrix.os, 'windows')"
      run: |
        uname -a

    - name: Print Architecture
      if: "startsWith(matrix.os, 'macos')"
      run: |
        sysctl -n machdep.cpu.brand_string
        arch

    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install Dependencies
      # cibuildwheel-2.23.3 fails with:
      # Building cp38-macosx_arm64 wheel
      # Download https://github.com/pypa/get-virtualenv/blob/20.30.0/public/virtualenv.pyz?raw=true
      #  -> fails because it is 404 now :( This means I have to drop Python 3.8 support.
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade-strategy eager --upgrade cython twine check-wheel-contents cibuildwheel~=4.3 build

    - name: Build Tarball
      working-directory: python/indexed_bzip2
      run: python3 -m build --sdist

    - name: Build Wheels
      env:
        CIBW_ARCHS: ${{ matrix.archs }}
        CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux-image }}
        CIBW_ENABLE: "pypy"
      run: python -m cibuildwheel --output-dir dist python/indexed_bzip2

    - name: Check Distributions
      shell: bash
      run: twine check --strict dist/* python/indexed_bzip2/dist/*

    # delvewheel produces Windows wheels with Root-Is-Purelib: false and a .data/platlib directory,
    # which check-wheel-contents rejects as an invalid wheel even though pip installs it.
    - name: Check Wheel Contents
      if: "!startsWith(matrix.os, 'windows')"
      shell: bash
      run: |
        # auditwheel adds an <package>.libs/ directory to repaired wheels.
        # Ignore W003,W009,W010, which fail on musllinux.
        check-wheel-contents --no-config --ignore W003,W009,W010 dist/*.whl

    - uses: actions/upload-artifact@v7
      if: "startsWith(matrix.os, 'windows') && matrix.archs == 'auto64'"
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.archs }}
        path: "dist/*-cp31*.whl"

    - name: Publish Tarball to PyPI
      # Only one out of the OS matrix needs to upload the tarball.
      if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-24.04' && matrix.archs == 'auto64' && matrix.manylinux-image == 'manylinux_2_28'
      env:
        TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
      working-directory: python/indexed_bzip2
      run: twine upload --skip-existing -u __token__ dist/*

  Build-ABI3-Wheels:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-26
        - macos-26-intel
        - ubuntu-24.04-arm
        - ubuntu-24.04
        - windows-latest
        archs: [auto64]
        manylinux-image: [manylinux_2_28]
        include:
        - os: ubuntu-24.04
          manylinux-image: manylinux_2_28
          archs: auto32

    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install Dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade-strategy eager --upgrade cython twine check-wheel-contents abi3audit cibuildwheel~=4.3 build

    - name: Build ABI3 Wheels
      env:
        CIBW_ARCHS: ${{ matrix.archs }}
        CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux-image }}
        # One wheel per platform covers all CPython versions >= 3.14.
        CIBW_BUILD: "cp314-*"
        # CIBW_ENVIRONMENT is required so that the variable also reaches the Linux container.
        CIBW_ENVIRONMENT: "INDEXED_BZIP2_ABI3=enable"
      run: python -m cibuildwheel --output-dir dist-abi3 python/indexed_bzip2

    - name: Check distributions
      shell: bash
      run: twine check --strict dist-abi3/*

    # delvewheel produces Windows wheels with Root-Is-Purelib: false and a .data/platlib directory,
    # which check-wheel-contents rejects as an invalid wheel even though pip installs it.
    - name: Check Wheel Contents
      if: "!startsWith(matrix.os, 'windows')"
      shell: bash
      run: |
        # auditwheel adds an <package>.libs/ directory to repaired wheels.
        # Ignore W003,W009,W010, which fail on musllinux.
        check-wheel-contents --no-config --ignore W003,W009,W010 dist-abi3/*.whl

    - name: Audit ABI3 wheels
      shell: bash
      run: abi3audit --strict dist-abi3/*.whl

    - name: Install ABI3 wheel
      if: matrix.archs != 'auto32'
      run: |
        python3 -m pip install --no-index --no-deps --find-links dist-abi3 indexed_bzip2
        python3 -c "import indexed_bzip2; print( indexed_bzip2.__version__ )"

    - uses: actions/upload-artifact@v7
      with:
        name: wheels-abi3-${{ matrix.os }}-${{ matrix.archs }}-${{ matrix.manylinux-image }}
        path: "dist-abi3/*.whl"
        if-no-files-found: error

  Publish:
    needs: [Build-Wheels, Build-ABI3-Wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download all distributions
      uses: actions/download-artifact@v7
      with:
        path: dist
        merge-multiple: true

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/')
      env:
        TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
      run: twine upload --skip-existing -u __token__ dist/*
